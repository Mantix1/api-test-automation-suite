[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --import-mode=importlib
markers =
    regression: fast P1 subset, runs on every push
    functional: happy-path behavior
    negative: invalid input, auth, unsupported methods
    boundary: values at, just inside, or just outside a limit
    contract: respose schema, headers error formats
    performance: response-time threshold, nightly only
    tc(id): links a test to its ID in docs/test_case_matrix.md
    